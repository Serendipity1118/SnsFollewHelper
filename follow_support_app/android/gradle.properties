org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This repository may be checked out under a Japanese-named Windows worktree.
android.overridePathCheck=true
# The Windows subst workspace and Pub cache are on different drive roots.
# Kotlin incremental path relativization fails across these roots.
kotlin.incremental=false
